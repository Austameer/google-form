databases:
  - name: google-form-db
    databaseName: googleformdb
    plan: free

services:
  - type: web
    name: google-form
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: google-form-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
